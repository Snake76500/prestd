[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prestd"
version = "0.1.0"
description = "High-performance, typed Python client library for pREST (prestd) on PostgreSQL with microservice integrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Fabien Chevalier" }
]
keywords = ["prest", "prestd", "postgresql", "rest", "fastapi", "microservice", "async", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]
all = [
    "prestd[fastapi,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["prestd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
